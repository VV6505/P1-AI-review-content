[project]
name = "worker"
version = "0.1.0"
description = "AI Review Content Factory — Python worker (internal FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crawl4ai==0.9.4",
    "edge-tts>=7.2.7",
    "fastapi>=0.142.2",
    "google-genai>=2.32.0",
    "gtts>=2.5.4",
    "httpx>=0.28.1",
    "jsonschema==4.26.0",  # validator contract M2 (trước đây chỉ là phụ thuộc bắc cầu)
    "pydantic>=2",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
